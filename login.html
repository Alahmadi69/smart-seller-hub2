<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smarthub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">Smarthub</a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="pricing.html">Pricing</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html" class="active" id="navLogin">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero hero-small">
            <h1 id="pageTitle">Welcome Back</h1>
            <p id="pageSubtitle">Sign in to access your dashboard.</p>
        </section>

        <section class="section-padding">
            <div class="container">
                <form id="authForm" class="custom-form">
                    <div id="nameField" class="form-field-hidden">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name">
                    </div>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>

                    <div id="auth-error-message" class="auth-error"></div>

                    <button type="submit" class="btn btn-primary" id="submitBtn">Sign In</button>

                    <div class="form-divider"><span>or</span></div>

                    <button type="button" id="googleBtn" class="btn btn-outline">Sign in with Google</button>

                    <p class="form-toggle">
                        <span id="toggleText">Don't have an account?</span>
                        <a href="#" id="toggleLink">Sign Up</a>
                    </p>
                </form>
            </div>
        </section>
    </main>

    <div class="floating-contact">
        <a href="https://wa.me/966539140828" class="floating-btn whatsapp" target="_blank" rel="noopener" aria-label="Contact on WhatsApp">
